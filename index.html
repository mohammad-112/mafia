<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>الولد - النسخة الكريستالية</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap');

        :root {
            --primary: #6366f1;
            --accent: #f43f5e;
            --gold: #fbbf24;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-heavy: rgba(15, 15, 20, 0.8);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(circle at top right, #1e1b4b, #0f172a, #020617);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            background-attachment: fixed;
        }

        body::before {
            content: '';
            position: fixed;
            top: -10%; left: -10%;
            width: 50%; height: 50%;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, transparent 70%);
            z-index: -1;
        }

        .app-shell {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        .logo-area { display: flex; align-items: center; gap: 15px; }
        .logo-icon {
            font-size: 2rem;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 10px rgba(99, 102, 241, 0.5));
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .input-wrapper { margin-bottom: 20px; }
        .input-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-dim);
            font-size: 0.9rem;
        }

        .crystal-input {
            width: 100%;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 12px 18px;
            color: white;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .crystal-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.3);
        }

        .names-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 10px;
            margin-top: 15px;
            max-height: 300px;
            overflow-y: auto;
            padding: 10px;
            background: rgba(0,0,0,0.2);
            border-radius: 16px;
        }

        .roles-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .role-chip {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
        }

        .role-chip.mafia { border-bottom: 4px solid var(--accent); }
        .role-chip.town { border-bottom: 4px solid var(--primary); }

        .counter-ui {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-top: 10px;
        }

        .circle-btn {
            width: 35px; height: 35px;
            border-radius: 50%;
            border: none;
            background: var(--glass-border);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        .circle-btn:hover { background: var(--primary); }

        .btn-action {
            width: 100%;
            padding: 18px;
            border-radius: 18px;
            border: none;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s ease;
        }

        .btn-action:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            filter: grayscale(1);
        }

        .btn-main {
            background: linear-gradient(90deg, var(--primary), #4f46e5);
            color: white;
        }

        .btn-ghost {
            background: transparent;
            border: 1px solid var(--glass-border);
            color: var(--text-dim);
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-dim);
            cursor: pointer;
            margin-bottom: 15px;
        }

        .hidden { display: none !important; }

        .reveal-box {
            perspective: 1000px;
            width: 280px;
            height: 380px;
            margin: 30px auto;
        }

        .card-inner {
            width: 100%; height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        .card-inner.flipped { transform: rotateY(180deg); }

        .card-face {
            position: absolute;
            width: 100%; height: 100%;
            backface-visibility: hidden;
            border-radius: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
            border: 1px solid var(--glass-border);
        }

        .card-front { background: var(--glass-heavy); }
        .card-back { 
            background: linear-gradient(145deg, #1e1b4b, #0f172a); 
            transform: rotateY(180deg);
            border-color: var(--gold);
        }

        .dashboard-grid { display: grid; grid-template-columns: 1fr 320px; gap: 20px; }
        .player-item {
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--glass-border);
            padding: 12px 18px;
            border-radius: 18px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .player-item.dead { opacity: 0.3; filter: grayscale(1); }

        .log-box {
            background: rgba(0,0,0,0.4);
            border-radius: 20px;
            height: 300px;
            overflow-y: auto;
            padding: 15px;
            font-size: 0.85rem;
            color: var(--text-dim);
            border: 1px solid var(--glass-border);
        }

        @media (max-width: 800px) {
            .dashboard-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="app-shell">
    <header class="header">
        <div class="logo-area">
            <span class="logo-icon">🎭</span>
            <div>
                <h1 style="font-size: 1.4rem; font-weight: 900; letter-spacing: 1px;">الولد ELITE</h1>
                <p id="status-text" style="font-size: 0.7rem; color: var(--text-dim);">نظام إدارة الجلسات الذكي</p>
            </div>
        </div>
        <div id="game-tag" class="hidden" style="background: var(--glass-border); padding: 5px 15px; border-radius: 12px;">
            <span id="cycle-label" style="font-weight: 700; color: var(--gold);">اليوم 1 - ليل 🌑</span>
        </div>
    </header>

    <!-- Setup Phase -->
    <section id="p-setup" class="glass-card">
        <h2 style="margin-bottom: 15px;">تجهيز الطاولة</h2>
        <div class="input-wrapper">
            <label class="input-label">عدد اللاعبين الكلي</label>
            <input type="number" id="inp-total" class="crystal-input" value="8" min="4" onchange="engine.generateNameInputs()">
        </div>
        <div class="input-wrapper">
            <label class="input-label">أسماء اللاعبين</label>
            <div id="names-container" class="names-grid">
                <!-- Names will be generated here -->
            </div>
        </div>
        <button class="btn-action btn-main" onclick="engine.goToBuilder()">تحديد الأدوار ➔</button>
    </section>

    <!-- Builder Phase -->
    <section id="p-builder" class="hidden">
        <div class="back-link" onclick="engine.switchPhase('p-setup')">← الرجوع لتعديل الأسماء</div>
        <div class="glass-card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2 id="builder-count-info">توزيع الأدوار</h2>
                <button class="btn-ghost" style="padding: 8px 15px; border-radius: 12px; font-size: 0.8rem;" onclick="engine.autoBalance()">توازن تلقائي</button>
            </div>
            <div id="builder-grid" class="roles-grid"></div>
            <div style="margin-top: 30px;">
                <button class="btn-action btn-main" onclick="engine.confirmRoles()">بدء توزيع البطاقات ➔</button>
            </div>
        </div>
    </section>

    <!-- Reveal Phase -->
    <section id="p-reveal" class="hidden">
        <div class="back-link" onclick="engine.confirmBackToBuilder()">← إلغاء وبدء التوزيع من جديد</div>
        <div class="glass-card" style="text-align: center;">
            <p style="color: var(--text-dim);">مرر الهاتف لـ:</p>
            <h1 id="reveal-target-name" style="font-size: 2.2rem; color: var(--gold); margin: 10px 0;">لاعب</h1>
            
            <div class="reveal-box">
                <div class="card-inner" id="reveal-card" onclick="engine.handleCardClick()">
                    <div class="card-face card-front">
                        <div style="font-size: 5rem;">❓</div>
                        <p style="margin-top: 20px; font-weight: 600;">اضغط للكشف</p>
                    </div>
                    <div class="card-face card-back" id="reveal-content"></div>
                </div>
            </div>
            
            <button id="btn-next-reveal" class="btn-action btn-main" style="max-width: 300px; margin: 0 auto;" onclick="engine.nextReveal()" disabled>
                اكشف هويتك أولاً
            </button>
            <p id="reveal-timer-text" style="font-size: 0.8rem; color: var(--accent); margin-top: 10px; height: 1.2rem;"></p>
        </div>
    </section>

    <!-- Handover Phase -->
    <section id="p-handover" class="hidden">
        <div class="glass-card" style="text-align: center; padding: 50px 30px;">
            <div style="font-size: 5rem; margin-bottom: 20px;">👤</div>
            <h1 style="color: var(--gold); margin-bottom: 15px;">انتهى التوزيع!</h1>
            <p style="font-size: 1.2rem; margin-bottom: 30px; line-height: 1.6;">الآن، يرجى تسليم الهاتف إلى <br><strong>المضيف / الراوي</strong> <br>لبدء إدارة الجلسة.</p>
            <button class="btn-action btn-main" onclick="engine.startDashboard()">أنا المضيف، ابدأ اللعبة ➔</button>
        </div>
    </section>

    <!-- Dashboard Phase -->
    <section id="p-dashboard" class="hidden">
        <div class="dashboard-grid">
            <div class="glass-card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
                    <h2>التحكم باللاعبين</h2>
                    <button class="btn-ghost" style="padding: 8px 15px; border-radius: 12px;" onclick="engine.toggleCycle()">تبديل الوقت 🌗</button>
                </div>
                <div id="player-list"></div>
            </div>
            <div class="glass-card" style="display: flex; flex-direction: column;">
                <h3>سجل الجلسة</h3>
                <div id="game-logs" class="log-box" style="margin: 15px 0; flex-grow: 1;"></div>
                <div style="display: grid; gap: 10px;">
                    <button class="btn-action btn-ghost" onclick="engine.rematch()" style="font-size: 0.9rem;">🔄 جولة جديدة (نفس الأسماء)</button>
                    <button class="btn-action btn-ghost" onclick="location.reload()" style="font-size: 0.9rem; color: var(--accent);">🚪 إنهاء كلي</button>
                </div>
            </div>
        </div>
    </section>
</div>

<script>
    const engine = {
        state: { 
            total: 0, 
            names: [], 
            roles: [], 
            players: [], 
            pointer: 0, 
            cycle: { day: 1, night: true },
            isRevealed: false,
            timer: null
        },

        roleTemplate: [
            { id: 'mafia', name: 'مافيا', icon: '🧛', team: 'red', desc: 'تقتل ضحية كل ليلة بصمت.', count: 0 },
            { id: 'doctor', name: 'دكتور', icon: '💊', team: 'green', desc: 'ينقذ لاعباً من الموت كل ليلة.', count: 0 },
            { id: 'detective', name: 'محقق', icon: '🔍', team: 'green', desc: 'يكشف هوية شخص كل ليلة.', count: 0 },
            { id: 'sniper', name: 'قناص', icon: '🎯', team: 'green', desc: 'يملك رصاصة واحدة للتصفية.', count: 0 },
            { id: 'citizen', name: 'مواطن', icon: '👨', team: 'green', desc: 'يصوت في النهار لكشف الخونة.', count: 0 }
        ],

        init() {
            this.generateNameInputs();
        },

        generateNameInputs() {
            const container = document.getElementById('names-container');
            const total = parseInt(document.getElementById('inp-total').value) || 4;
            let html = '';
            for (let i = 1; i <= total; i++) {
                html += `
                    <div class="name-field">
                        <input type="text" class="crystal-input name-input" placeholder="اسم لاعب ${i}" value="${this.state.names[i-1] || ''}">
                    </div>
                `;
            }
            container.innerHTML = html;
        },

        switchPhase(id) {
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            window.scrollTo(0,0);
        },

        goToBuilder() {
            this.state.total = parseInt(document.getElementById('inp-total').value);
            if (this.state.total < 4) return alert("الحد الأدنى 4 لاعبين");
            
            const nameInputs = document.querySelectorAll('.name-input');
            this.state.names = Array.from(nameInputs).map((input, i) => input.value.trim() || `لاعب ${i+1}`);
            
            if (!this.state.roles || this.state.roles.length === 0 || this.state.roles.every(r => r.count === 0)) {
                this.state.roles = JSON.parse(JSON.stringify(this.roleTemplate));
            }
            this.renderBuilder();
            this.switchPhase('p-builder');
        },

        renderBuilder() {
            const grid = document.getElementById('builder-grid');
            grid.innerHTML = this.state.roles.map((r, i) => `
                <div class="role-chip ${r.team === 'red' ? 'mafia' : 'town'}">
                    <div style="font-size: 1.5rem;">${r.icon}</div>
                    <div style="font-weight: 700; margin: 5px 0;">${r.name}</div>
                    <div class="counter-ui">
                        <button class="circle-btn" onclick="engine.adjust(${i}, -1)">-</button>
                        <span style="font-weight: 900; min-width: 25px;">${r.count}</span>
                        <button class="circle-btn" onclick="engine.adjust(${i}, 1)">+</button>
                    </div>
                </div>
            `).join('');
            this.updateBuilderInfo();
        },

        adjust(i, delta) {
            if (this.state.roles[i].count + delta >= 0) {
                this.state.roles[i].count += delta;
                this.renderBuilder();
            }
        },

        updateBuilderInfo() {
            const sum = this.state.roles.reduce((a, b) => a + b.count, 0);
            const info = document.getElementById('builder-count-info');
            info.innerText = `توزيع الأدوار (${sum}/${this.state.total})`;
            info.style.color = sum === this.state.total ? '#4ade80' : 'white';
        },

        autoBalance() {
            const t = this.state.total;
            this.state.roles.forEach(r => r.count = 0);
            const m = Math.max(1, Math.floor(t / 4));
            this.state.roles.find(r => r.id === 'mafia').count = m;
            this.state.roles.find(r => r.id === 'doctor').count = 1;
            if (t > 5) this.state.roles.find(r => r.id === 'detective').count = 1;
            if (t > 7) this.state.roles.find(r => r.id === 'sniper').count = 1;
            const currentSum = this.state.roles.reduce((a, b) => a + b.count, 0);
            this.state.roles.find(r => r.id === 'citizen').count = Math.max(0, t - currentSum);
            this.renderBuilder();
        },

        confirmRoles() {
            const sum = this.state.roles.reduce((a, b) => a + b.count, 0);
            if (sum !== this.state.total) return alert(`يجب أن يكون مجموع الأدوار مساوياً لـ ${this.state.total}`);
            
            this.distributePlayers();
            this.state.pointer = 0;
            this.renderReveal();
            this.switchPhase('p-reveal');
        },

        distributePlayers() {
            let pool = [];
            this.state.roles.forEach(r => {
                for(let k=0; k<r.count; k++) pool.push({...r});
            });
            pool.sort(() => Math.random() - 0.5);
            this.state.players = this.state.names.map((n, i) => ({
                name: n,
                role: pool[i],
                alive: true
            }));
        },

        confirmBackToBuilder() {
            if(confirm("إعادة التوزيع؟ سيتم خلط الأدوار من جديد.")) {
                this.switchPhase('p-builder');
            }
        },

        handleCardClick() {
            const card = document.getElementById('reveal-card');
            if (!card.classList.contains('flipped')) {
                card.classList.add('flipped');
                this.state.isRevealed = true;
                this.startRevealCountdown();
            }
        },

        startRevealCountdown() {
            const btn = document.getElementById('btn-next-reveal');
            const timerTxt = document.getElementById('reveal-timer-text');
            let timeLeft = 1; 

            btn.disabled = true;
            btn.innerText = `انتظر ${timeLeft}...`;

            if (this.state.timer) clearInterval(this.state.timer);

            this.state.timer = setInterval(() => {
                timeLeft--;
                if (timeLeft > 0) {
                    btn.innerText = `انتظر ${timeLeft}...`;
                } else {
                    clearInterval(this.state.timer);
                    btn.disabled = false;
                    btn.innerText = "اللاعب التالي ➔";
                    timerTxt.innerText = "يمكنك الانتقال الآن ✅";
                }
            }, 1000);
        },

        renderReveal() {
            const p = this.state.players[this.state.pointer];
            this.state.isRevealed = false;
            if (this.state.timer) clearInterval(this.state.timer);
            
            const btn = document.getElementById('btn-next-reveal');
            btn.disabled = true;
            btn.innerText = "اكشف هويتك أولاً";
            document.getElementById('reveal-timer-text').innerText = "";
            document.getElementById('reveal-target-name').innerText = p.name;
            document.getElementById('reveal-card').classList.remove('flipped');
            
            document.getElementById('reveal-content').innerHTML = `
                <div style="font-size: 4rem;">${p.role.icon}</div>
                <h2 style="color: var(--gold); margin: 10px 0;">${p.role.name}</h2>
                <p style="font-size: 0.8rem; color: var(--text-dim); line-height: 1.4;">${p.role.desc}</p>
                <div style="margin-top: 20px; padding: 5px 15px; border-radius: 10px; background: ${p.role.team === 'red' ? 'rgba(244,63,94,0.2)' : 'rgba(99,102,241,0.2)'}; color: ${p.role.team === 'red' ? 'var(--accent)' : 'var(--primary)'}; font-weight: 700;">
                    فريق: ${p.role.team === 'red' ? 'المافيا' : 'المواطنين'}
                </div>
            `;
        },

        nextReveal() {
            if (this.state.pointer < this.state.players.length - 1) {
                this.state.pointer++;
                this.renderReveal();
            } else {
                this.switchPhase('p-handover');
            }
        },

        startDashboard() {
            this.switchPhase('p-dashboard');
            document.getElementById('game-tag').classList.remove('hidden');
            this.state.cycle = { day: 1, night: true };
            this.updateCycleUI();
            document.getElementById('game-logs').innerHTML = "";
            this.addLog("بدأت اللعبة. ليلة سعيدة للجميع!");
            this.renderPlayers();
        },

        renderPlayers() {
            const list = document.getElementById('player-list');
            list.innerHTML = this.state.players.map((p, i) => `
                <div class="player-item ${p.alive ? '' : 'dead'}">
                    <div style="display: flex; align-items: center; gap: 12px;">
                        <span style="font-size: 1.2rem;">${p.role.icon}</span>
                        <div>
                            <div style="font-weight: 700;">${p.name}</div>
                            <div style="font-size: 0.7rem; color: var(--text-dim);">${p.role.name}</div>
                        </div>
                    </div>
                    <button class="btn-ghost" style="padding: 5px 15px; border-radius: 10px; font-size: 0.75rem;" onclick="engine.toggleLife(${i})">
                        ${p.alive ? 'تصفية ☠️' : 'إحياء ✨'}
                    </button>
                </div>
            `).join('');
        },

        toggleLife(i) {
            const p = this.state.players[i];
            p.alive = !p.alive;
            this.addLog(p.alive ? `تمت إعادة ${p.name} للعبة.` : `ودعنا ${p.name}، كان ${p.role.name}.`);
            this.renderPlayers();
        },

        toggleCycle() {
            if (!this.state.cycle.night) {
                this.state.cycle.day++;
                this.state.cycle.night = true;
            } else {
                this.state.cycle.night = false;
            }
            this.updateCycleUI();
            this.addLog(`انتقلنا إلى: ${this.state.cycle.night ? 'الليل' : 'النهار'} من اليوم ${this.state.cycle.day}`);
        },

        updateCycleUI() {
            const label = document.getElementById('cycle-label');
            label.innerText = `اليوم ${this.state.cycle.day} - ${this.state.cycle.night ? 'ليل 🌑' : 'نهار ☀️'}`;
        },

        addLog(msg) {
            const box = document.getElementById('game-logs');
            const time = new Date().toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit'});
            box.innerHTML = `<div style="margin-bottom: 8px; padding-bottom: 5px; border-bottom: 1px solid rgba(255,255,255,0.05);">
                <span style="color: var(--primary)">[${time}]</span> ${msg}
            </div>` + box.innerHTML;
        },

        rematch() {
            if(confirm("إعادة توزيع الأدوار بنفس الأسماء؟")) {
                // إعادة خلط وتوزيع الأدوار
                this.distributePlayers();
                this.state.pointer = 0;
                this.renderReveal();
                this.switchPhase('p-reveal');
                document.getElementById('game-tag').classList.add('hidden');
            }
        }
    };

    // Initialize on load
    window.onload = () => engine.init();
</script>
</body>
</html>
